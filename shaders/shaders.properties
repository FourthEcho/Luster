# -------------------
#   Custom Uniforms
# -------------------

uniform.vec2.viewRes = vec2(viewWidth, viewHeight)
uniform.vec2.viewPixelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)

# taa jitter offset using R2 sequence
# http://extremelearning.com.au/unreasonable-effectiveness-of-quasirandom-sequences/
variable.float.jitterX = frac(1.3247179572 * frameCounter + 0.5) * 2.0 - 1.0
variable.float.jitterY = frac(1.7548776662 * frameCounter + 0.5) * 2.0 - 1.0
uniform.vec2.taaOffset = vec2(jitterX / viewWidth, jitterY / viewHeight)

# Lighting uniforms

uniform.float.eyeSkylight   = smooth(eyeBrightness.y / 240.0, 1.0, 1.0)

variable.float.viewSunDirNorm = 1.0 / sqrt((sunPosition.x * sunPosition.x) + (sunPosition.y * sunPosition.y) + (sunPosition.z * sunPosition.z))
variable.float.viewSunDirX = sunPosition.x * viewSunDirNorm
variable.float.viewSunDirY = sunPosition.y * viewSunDirNorm
variable.float.viewSunDirZ = sunPosition.z * viewSunDirNorm
uniform.vec3.viewSunDir = vec3(viewSunDirX, viewSunDirY, viewSunDirZ)

variable.float.sunDirX = gbufferModelViewInverse.0.0 * viewSunDirX + gbufferModelViewInverse.1.0 * viewSunDirY + gbufferModelViewInverse.2.0 * viewSunDirZ
variable.float.sunDirY = gbufferModelViewInverse.0.1 * viewSunDirX + gbufferModelViewInverse.1.1 * viewSunDirY + gbufferModelViewInverse.2.1 * viewSunDirZ
variable.float.sunDirZ = gbufferModelViewInverse.0.2 * viewSunDirX + gbufferModelViewInverse.1.2 * viewSunDirY + gbufferModelViewInverse.2.2 * viewSunDirZ
uniform.vec3.sunDir = vec3(sunDirX, sunDirY, sunDirZ)

variable.float.viewMoonDirNorm = 1.0 / sqrt((moonPosition.x * moonPosition.x) + (moonPosition.y * moonPosition.y) + (moonPosition.z * moonPosition.z))
variable.float.viewMoonDirX = moonPosition.x * viewMoonDirNorm
variable.float.viewMoonDirY = moonPosition.y * viewMoonDirNorm
variable.float.viewMoonDirZ = moonPosition.z * viewMoonDirNorm

variable.float.moonDirX = gbufferModelViewInverse.0.0 * viewMoonDirX + gbufferModelViewInverse.1.0 * viewMoonDirY + gbufferModelViewInverse.2.0 * viewMoonDirZ
variable.float.moonDirY = gbufferModelViewInverse.0.1 * viewMoonDirX + gbufferModelViewInverse.1.1 * viewMoonDirY + gbufferModelViewInverse.2.1 * viewMoonDirZ
variable.float.moonDirZ = gbufferModelViewInverse.0.2 * viewMoonDirX + gbufferModelViewInverse.1.2 * viewMoonDirY + gbufferModelViewInverse.2.2 * viewMoonDirZ
uniform.vec3.moonDir = vec3(moonDirX, moonDirY, moonDirZ)

variable.float.viewLightDirX = if(sunAngle < 0.5, viewSunDirX, viewMoonDirX)
variable.float.viewLightDirY = if(sunAngle < 0.5, viewSunDirY, viewMoonDirY)
variable.float.viewLightDirZ = if(sunAngle < 0.5, viewSunDirZ, viewMoonDirZ)
uniform.vec3.viewLightDir = vec3(viewLightDirX, viewLightDirY, viewLightDirZ)

variable.float.lightDirX = if(sunAngle < 0.5, sunDirX, moonDirX)
variable.float.lightDirY = if(sunAngle < 0.5, sunDirY, moonDirY)
variable.float.lightDirZ = if(sunAngle < 0.5, sunDirZ, moonDirZ)
uniform.vec3.lightDir = vec3(lightDirX, lightDirY, lightDirZ)

# Time uniforms

variable.float.meFade      = if(sunDirY < 0.18, 0.37 + 1.2 * max(0.0, -sunDirY), 1.7)
variable.float.meWeight    = pow(clamp(1.0 - meFade * abs(sunDirY - 0.18), 0.0, 1.0), 2.0)
uniform.float.timeSunrise  = if(sunDirX > 0.0, 1.0, 0.0) * meWeight
uniform.float.timeNoon     = if(sunDirY > 0.0, 1.0, 0.0) * (1.0 - meWeight)
uniform.float.timeMidnight = if(sunDirY < 0.0, 1.0, 0.0) * (1.0 - meWeight)
uniform.float.timeSunset   = if(sunDirX < 0.0, 1.0, 0.0) * meWeight


# World age in seconds, repeating every 128 days. This is used for animating atmospherics
uniform.float.worldAge = ((worldDay % 128) * 24000.0 + worldTime) / 20.0

# Detect whether gamerule doDaylightCycle is enabled
uniform.bool.daylightCycleEnabled = worldTime > smooth(worldTime, 0.1, 0.1)

# Detect whether world age has drastically changed since the last frame
variable.float.worldAgeDelta = abs(worldAge - smooth(worldAge, 0.1, 0.1))
uniform.bool.worldAgeChanged = worldAgeDelta > 1.0

variable.float.lightningFlashBase = if(equals(skyColor.r, skyColor.g, 0.01) && skyColor.r > 0.3, 1.0, 0.0)
uniform.float.lightningFlashIris = smooth(if(lightningBoltPosition.w > 0.5, lightningFlashBase, 0.0), 0.0, 0.75)

#ifdef moonPhaseAffectsBrightness
uniform.float.moonPhaseBrightness = if( \
        moonPhase == 0, 1.0,                  \
        moonPhase == 1, 0.875,                \
        moonPhase == 2, 0.75,                 \
        moonPhase == 3, 0.625,                \
        moonPhase == 4, 0.5,                  \
        moonPhase == 5, 0.75,                 \
        moonPhase == 6, 0.875,                \
        moonPhase == 7, 1.0,                  \
        1.0 \
) \
#else
uniform.float.moonPhaseBrightness = 1.0
#endif

# Adjust the color saturation of the atmosphere and sunlight colour depending on the time of day
variable.float.blueHour = exp(-150.0 * (sunDirY + 0.07283) * (sunDirY + 0.07283))
uniform.float.atmosphereSaturationBoostAmount = 0.10 + 0.20 * blueHour

# for clouds
variable.float.dayFactorU = clamp(abs(sunDir.y) / 0.3, 0.0, 1.0)
uniform.float.dayFactor = dayFactorU * dayFactorU * (3.0 - 2.0 * dayFactorU)

# Biome uniforms

# Fix biome_precipitation on Iris 1.7 (thanks to sw-52)
#ifndef PPT_NONE
#define PPT_NONE 0
#endif
#ifndef PPT_RAIN
#define PPT_RAIN 1
#endif
#ifndef PPT_SNOW
#define PPT_SNOW 2
#endif

#if MC_VERSION >= 12102
uniform.float.biomePaleGarden = smooth(if(in(biome, BIOME_PALE_GARDEN), 1.0, 0.0), 10, 10)
#else
uniform.float.biomePaleGarden = 0.0
#endif

uniform.float.biomeCave        = smooth(clamp((63.0 - eyeAltitude) / (63.0 - 50.0), 0.0, 1.0) * (1.0 - eyeBrightness.y / 240.0), 5.0, 2.0)
uniform.float.biomeArid        = smooth(if(biomeCategory == CAT_DESERT || biomeCategory == CAT_MESA || biomeCategory == CAT_SAVANNA, 1.0, 0.0), 30, 30)
uniform.float.biomeSnowy       = smooth(if(biomeCategory == CAT_ICY, 1.0, 0.0), 30, 30)
uniform.float.biomeTaiga       = smooth(if(biomeCategory == CAT_TAIGA, 1.0, 0.0), 30, 30)
uniform.float.biomeJungle      = smooth(if(biomeCategory == CAT_JUNGLE, 1.0, 0.0), 30, 30)
uniform.float.biomeSwamp       = smooth(if(biomeCategory == CAT_SWAMP, 1.0, 0.0), 30, 30)
uniform.float.biomeTemperate   = 1.0 - biomeArid - biomeSnowy - biomeTaiga - biomeJungle - biomeSwamp - biomePaleGarden
uniform.float.biomeMayRain    = smooth(if(biomePrecipitation == PPT_RAIN, 1.0, 0.0), 30, 30)
uniform.float.biomeMaySnow    = smooth(if(biomePrecipitation == PPT_SNOW, 1.0, 0.0), 30, 30)
uniform.float.biomeTemperature = smooth(temperature * 2.0 - 1.0, 1000, 1000)
uniform.float.biomeHumidity    = smooth(rainfall * 2.0 - 1.0, 1000, 1000)

uniform.float.desertSandstormWeather    = smooth(if(biomeCategory == CAT_DESERT || biomeCategory == CAT_MESA, rainStrength, 0.0), 60.0, 30.0)
uniform.float.biomeMaySandstorm = smooth(if(biomeCategory == CAT_DESERT || biomeCategory == CAT_MESA, 1.0, 0.0), 30, 30)

# Distant Horizons combined depth buffer

#ifdef DISTANT_HORIZONS
# references:
# https://shaderlabs.org/wiki/Shader_Tricks#Constructing_perspective_projection_matrices
# https://www.symbolab.com/solver/matrix-inverse-calculator/inverse%5Cbegin%7Bpmatrix%7D%5Cfrac%7Bcot%5Cleft(%5Cfrac%7B%5Ctheta%7D%7B2%7D%5Cright)%7D%7Ba%7D%260%260%260%5C%5C%20%20%200%26cot%5Cleft(%5Cfrac%7B%5Ctheta%7D%7B2%7D%5Cright)%260%260%5C%5C%20%20%200%260%26-%5Cfrac%7BZ_%7Bf%7D%2BZ_%7Bn%7D%7D%7BZ_%7Bf%7D-Z_%7Bn%7D%7D%26-%20%5Cfrac%7B2%20Z_%7Bf%7D%20Z_%7Bn%7D%7D%7BZ_%7Bf%7D%20-%20Z_%7Bn%7D%7D%5C%5C%20%20%200%260%26-1%260%5Cend%7Bpmatrix%7D?or=input

variable.float.fov = 2.0 * atan(1.0 / (gbufferProjection.0.0 * aspectRatio))

uniform.float.combinedNear = near
uniform.float.combinedFar = dhRenderDistance
uniform.vec4.combinedProjectionMatrix0 = vec4(gbufferProjection.0.0, 0.0, 0.0, 0.0)
uniform.vec4.combinedProjectionMatrix1 = vec4(0.0, gbufferProjection.1.1, 0.0, 0.0)
uniform.vec4.combinedProjectionMatrix2 = vec4(gbufferProjection.2.0, gbufferProjection.2.1, (combinedFar + combinedNear) / (combinedNear - combinedFar), -1.0)
uniform.vec4.combinedProjectionMatrix3 = vec4(0.0, 0.0, (2.0 * combinedFar * combinedNear) / (combinedNear - combinedFar), 0.0)

uniform.vec4.combinedProjectionMatrixInverse0 = vec4(gbufferProjectionInverse.0.0, 0.0, 0.0, 0.0)
uniform.vec4.combinedProjectionMatrixInverse1 = vec4(0.0, gbufferProjectionInverse.1.1, 0.0, 0.0)
uniform.vec4.combinedProjectionMatrixInverse2 = vec4(0.0, 0.0, 0.0, -(combinedFar - combinedNear) / (2.0 * combinedFar * combinedNear))
uniform.vec4.combinedProjectionMatrixInverse3 = vec4(gbufferProjectionInverse.3.0, gbufferProjectionInverse.3.1, -1.0, (combinedFar + combinedNear) / (2.0 * combinedFar * combinedNear))
#endif

