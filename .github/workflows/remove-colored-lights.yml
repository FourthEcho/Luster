'''
          # Remove the versioned 10032 block and the old 10064 modded-light block section,
          # then insert the new mutually-exclusive version map.
          text = text[:s1] + replacement + text[e1:]
          # Remove the following modded colored-light section, if present.
          m = re.search(r'^#[-]{8,}\\n#\\s*10064-10079.*?(?=^#[-]{8,}$)', text, flags=re.M | re.S)
          if m:
              text = text[:m.start()] + text[m.end():]
          block_file.write_text(text, encoding='utf-8')

          # --- final repo-wide cleanup of colored-light feature names ---
          text_exts = shader_exts | {'.properties', '.json', '.md', '.txt'}
          for p in ROOT.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_exts:
                  continue
              if '.git' in p.parts:
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              n = re.sub(r'(?<![A-Z0-9_])COLORED_LIGHTS(?![A-Z0-9_])', '', t)
              # Remove non-handheld colored-light setting identifiers if they remain.
              n = re.sub(r'(?<![A-Z0-9_])COLORED_LIGHTS_(?!HANDHELD)[A-Z0-9_]+', '', n)
              n = re.sub(r'[ ]{2,}', ' ', n)
              if n != t:
                  p.write_text(n, encoding='utf-8')

          # --- verification ---
          assert not (SHADERS / 'ph_lights.json').exists()
          handheld = (SHADERS / 'include/lighting/handheld_lighting.glsl').read_text(encoding='utf-8')
          handheld_colors = (SHADERS / 'include/lighting/colors/lighting_colors.glsl').read_text(encoding='utf-8')
          assert 'HANDHELD_LIGHTING_COLORED' in handheld
          assert 'get_lighting_color' in handheld
          assert 'const vec3 lighting_colors[32]' in handheld_colors

          all_text = []
          for p in ROOT.rglob('*'):
              if p.is_file() and p.suffix.lower() in text_exts:
                  try:
                      all_text.append((p, p.read_text(encoding='utf-8')))
                  except UnicodeDecodeError:
                      pass
          bad = []
          for p, t in all_text:
              if re.search(r'(?<![A-Z0-9_])COLORED_LIGHTS(?![A-Z0-9_])', t):
                  bad.append(str(p))
              if re.search(r'(?<![A-Z0-9_])COLORED_LIGHTS_(?!HANDHELD)[A-Z0-9_]+', t):
                  bad.append(str(p))
          if bad:
              raise SystemExit('Colored-light references remain: ' + ', '.join(sorted(set(bad))))

          # Make sure the retained screen really exists and is empty.
          props = (SHADERS / 'shaders.properties').read_text(encoding='utf-8')
          assert re.search(r'^screen\\.colored_lights\\s*=\\s*<empty>\\s*$', props, flags=re.M)

          # Confirm the requested version bands and all current light-source IDs are represented.
          bp = (SHADERS / 'block.properties').read_text(encoding='utf-8')
          for version_marker in ('12109','12100','12000','11900','11700','11600'):
              assert version_marker in bp, f'missing MC_VERSION band {version_marker}'
          for name in ('sea_lantern','end_rod','torch','lantern','respawn_anchor','conduit','calibrated_sculk_sensor','copper_bulb:lit=true','open_eyeblossom','copper_lantern','nether_portal','end_portal'):
              assert name in bp, f'missing emissive mapping: {name}'
          print('Colored-light removal and emissive-map audit passed.')
          PY

      - name: Commit and push verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git add shaders .github/workflows/remove-colored-lights.yml
          git commit -m "chore: completely remove colored lights"
          git push origin HEAD:remove-colored-lights
