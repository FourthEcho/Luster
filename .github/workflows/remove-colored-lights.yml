#   1.16       Nether Update additions
#   1.17-1.18  Caves & Cliffs lighting additions
#   1.19       Wild Update additions
#   1.20       Calibrated sculk sensor / torchflower
#   1.21-1.21.3 Trial Chambers / copper bulbs
#   1.21.4-1.21.8 Pale Garden
#   1.21.9+    Copper Age; current 26.1 uses the same light-source set
