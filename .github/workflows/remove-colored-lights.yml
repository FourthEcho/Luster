name: Remove colored lights

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [remove-colored-lights]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'remove-colored-lights' || github.ref_name == 'remove-colored-lights' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: remove-colored-lights
          fetch-depth: 2
          persist-credentials: true

      - name: Remove colored lights and rebuild emissive map
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          SHADERS = ROOT / 'shaders'

          # --- shader preprocessor cleanup ---
          # Evaluate only the colored-light conditional blocks. Handheld colored
          # lighting is deliberately excluded from this pass.
          FEATURE_WORDS = (
              'COLORED_LIGHTS',
              'COLORED_LIGHTS_VANILLA_LIGHTMAP_CONTRIBUTION',
              'COLORED_LIGHTS_VANILLA_LIGHTMAP_CONTRIBUTION_FALLOFF',
          )

          def feature_condition_value(expr: str):
              e = expr.strip()
              if 'HANDHELD_LIGHTING_COLORED' in e:
                  return None
              if re.fullmatch(r'(?:defined\\s*\\(\\s*)?COLORED_LIGHTS(?:\\s*\\))?', e):
                  return False
              if re.fullmatch(r'!\\s*defined\\s*\\(\\s*COLORED_LIGHTS\\s*\\)', e):
                  return True
              if 'COLORED_LIGHTS' not in e:
                  return None
              # Collapse simple boolean expressions that become constants.
              e2 = re.sub(r'!\\s*defined\\s*\\(\\s*COLORED_LIGHTS(?:_[A-Z0-9_]+)?\\s*\\)', '1', e)
              e2 = re.sub(r'defined\\s*\\(\\s*COLORED_LIGHTS(?:_[A-Z0-9_]+)?\\s*\\)', '0', e2)
              e2 = re.sub(r'\\bCOLORED_LIGHTS(?:_[A-Z0-9_]+)?\\b', '0', e2)
              compact = re.sub(r'\\s+', '', e2)
              if re.fullmatch(r'[01()&|!]+', compact):
                  try:
                      # Translate C-like boolean operators into Python equivalents.
                      py = compact.replace('&&', ' and ').replace('||', ' or ').replace('!', ' not ')
                      return bool(eval(py, {'__builtins__': {}}, {}))
                  except Exception:
                      pass
              return None

          def rewrite_conditionals(text: str) -> str:
              lines = text.splitlines(True)
              out = []
              i = 0
              while i < len(lines):
                  s = lines[i].strip()
                  m = re.match(r'#(ifdef|ifndef|if)\\b(.*)', s)
                  if not m or 'COLORED_LIGHTS' not in m.group(2):
                      out.append(lines[i])
                      i += 1
                      continue

                  kind, expr = m.group(1), m.group(2).strip()
                  if kind == 'ifdef' and expr == 'COLORED_LIGHTS':
                      value = False
                  elif kind == 'ifndef' and expr == 'COLORED_LIGHTS':
                      value = True
                  else:
                      value = feature_condition_value(expr)

                  # If the condition is not safely classifiable, only remove the
                  # feature name from the expression and leave the rest intact.
                  if value is None:
                      repl = expr
                      repl = re.sub(r'defined\\s*\\(\\s*COLORED_LIGHTS(?:_[A-Z0-9_]+)?\\s*\\)', '0', repl)
                      repl = re.sub(r'\\bCOLORED_LIGHTS(?:_[A-Z0-9_]+)?\\b', '0', repl)
                      out.append('#if ' + repl + '\n')
                      i += 1
                      continue

                  # Collect the conditional block, respecting nested #if/#endif.
                  start = i
                  depth = 0
                  branches = [[]]
                  branch_index = 0
                  saw_else = False
                  i += 1
                  while i < len(lines):
                      inner = lines[i].strip()
                      if re.match(r'#if(n?def)?\\b|#if\\b', inner):
                          depth += 1
                          branches[branch_index].append(lines[i])
                      elif inner.startswith('#endif'):
                          if depth == 0:
                              break
                          depth -= 1
                          branches[branch_index].append(lines[i])
                      elif depth == 0 and inner.startswith('#else'):
                          if not saw_else:
                              saw_else = True
                              branch_index += 1
                              branches.append([])
                          else:
                              branches[branch_index].append(lines[i])
                      elif depth == 0 and inner.startswith('#elif'):
                          # Treat any elif as an alternative branch. For these
                          # cleanup targets, keeping the non-feature branch is safe.
                          branch_index += 1
                          branches.append([])
                      else:
                          branches[branch_index].append(lines[i])
                      i += 1
                  if i >= len(lines):
                      # Unterminated block: preserve original source rather than corrupting it.
                      out.extend(lines[start:i])
                      break
                  i += 1  # consume #endif

                  if saw_else and len(branches) >= 2:
                      chosen = branches[1] if value is False else branches[0]
                      out.extend(chosen)
                  elif value:
                      out.extend(branches[0])
                  # value == False and no else => whole feature block removed.
              return ''.join(out)

          shader_exts = {'.glsl', '.vsh', '.fsh', '.gsh', '.csh'}
          for p in SHADERS.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in shader_exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = rewrite_conditionals(text)
              # Remove standalone feature-only macro definitions/includes while
              # preserving HANDHELD_LIGHTING_COLORED and its include tree.
              new = re.sub(r'^\\s*#(?:define|undef)\\s+COLORED_LIGHTS(?:_\\w+)?(?:[^\\n]*\\n|$)', '', new, flags=re.M)
              new = re.sub(r'^\\s*#include[^\\n]*COLORED_LIGHTS[^\\n]*\\n', '', new, flags=re.M)
              if new != text:
                  p.write_text(new, encoding='utf-8')

          # --- settings cleanup ---
          settings = SHADERS / 'settings.glsl'
          t = settings.read_text(encoding='utf-8')
          t = re.sub(r'^.*COLORED_LIGHTS(?:_[A-Z0-9_]+)?[^\\n]*\\n', '', t, flags=re.M)
          settings.write_text(t, encoding='utf-8')

          # --- GUI cleanup ---
          props = SHADERS / 'shaders.properties'
          t = props.read_text(encoding='utf-8')
          t = re.sub(r'\\s*!?COLORED_LIGHTS(?=\\s|$)', '', t)
          # Replace the lighting entry with a retained empty Colored Lights screen.
          t = re.sub(r'^screen\\.lighting\\s*=.*$',
                     'screen.lighting     = [colored_lights] [indirect_lighting] [ibl] [light_sources] [shadows] [ao]', t, flags=re.M)
          t = re.sub(r'(?ms)^# Lighting submenus.*?^screen\\.indirect_lighting\\s*=.*$',
                     lambda m: '# Lighting submenus\\n' + next(line for line in m.group(0).splitlines() if line.startswith('screen.indirect_lighting')),
                     t, count=1)
          t = re.sub(r'(?ms)^# Colored Lights/LPV.*?^screen\\.indirect_lighting\\s*=.*\\n',
                     'screen.indirect_lighting = SSGI SSGI_TEMPORAL_ACCUMULATION <empty> <empty> SSGI_INTENSITY SSGI_RADIUS SSGI_RAY_STEPS SSGI_BOUNCES SSGI_TEMPORAL_WEIGHT SSGI_FILTER_RADIUS\\n',
                     t)
          t = re.sub(r'(?ms)^screen\\.main_lighting\\s*=.*?(?=^screen\\.indirect_lighting)', '', t)
          t = re.sub(r'(?m)^screen\\.colored_lights_settings\\s*=.*\\n', '', t)
          # Keep the named Colored Lights screen, but deliberately make it empty.
          if re.search(r'^screen\\.colored_lights\\s*=', t, flags=re.M):
              t = re.sub(r'^screen\\.colored_lights\\s*=.*$', 'screen.colored_lights = <empty>', t, flags=re.M)
          else:
              anchor = 'screen.lighting     = [colored_lights] [indirect_lighting] [ibl] [light_sources] [shadows] [ao]\\n'
              t = t.replace(anchor, anchor + 'screen.colored_lights = <empty>\\n')
          # Remove the old Mac-only Colored Lights UI gate.
          t = re.sub(r'(?ms)^# Colored Lights/LPV is.*?^# Water submenus', '# Water submenus', t)
          props.write_text(t, encoding='utf-8')

          # --- shared globals cleanup ---
          global_file = SHADERS / 'include/global.glsl'
          t = global_file.read_text(encoding='utf-8')
          t = re.sub(r'(?ms)^// Apple ships only OpenGL 4\\.1.*?^#endif\\s*\\n', '', t)
          global_file.write_text(t, encoding='utf-8')

          # --- delete the dedicated colored-light lookup table ---
          ph = SHADERS / 'ph_lights.json'
          if ph.exists():
              ph.unlink()

          # The LPV voxel/floodfill path is retained for non-colored lighting.
          # Remove its colored-light-only include if it has become unused.
          floodfill = SHADERS / 'include/lighting/lpv/floodfill.glsl'
          if floodfill.exists():
              t = floodfill.read_text(encoding='utf-8')
              # Replace colored tinting with neutral white propagation while keeping
              # the LPV machinery available to indirect/volumetric lighting.
              t = re.sub(r'vec3 get_emitted_light\\(uint block_id\\) \\{.*?\\n\\}',
                         'vec3 get_emitted_light(uint block_id) {\\n    if (is_emitter(block_id)) {\\n        return vec3(1.0);\\n    }\\n    return vec3(0.0);\\n}', t, flags=re.S)
              t = re.sub(r'vec3 get_tint\\(uint block_id, bool is_transparent\\) \\{.*?\\n\\}',
                         'vec3 get_tint(uint block_id, bool is_transparent) {\\n    return vec3(is_transparent);\\n}', t, flags=re.S)
              floodfill.write_text(t, encoding='utf-8')

          # Remove the LPV color table if nothing still references it.
          lpv_color = SHADERS / 'include/lighting/lpv/light_colors.glsl'
          all_text = []
          for p in SHADERS.rglob('*'):
              if p.is_file() and p.suffix.lower() in shader_exts | {'.properties', '.json'}:
                  try:
                      all_text.append(p.read_text(encoding='utf-8'))
                  except UnicodeDecodeError:
                      pass
          joined = '\\n'.join(all_text)
          if lpv_color.exists() and not re.search(r'(?:get_lpv_light_color|get_lpv_tint_color|#include[^\\n]*lpv/light_colors)', joined):
              lpv_color.unlink()

          # --- versioned vanilla emissive block map ---
          block_file = SHADERS / 'block.properties'
          text = block_file.read_text(encoding='utf-8')
          def section_span(src: str, needle: str):
              marker = src.find(needle)
              if marker < 0:
                  raise RuntimeError(f'missing section marker: {needle}')
              start = src.rfind('#', 0, marker)
              # section separator is the line immediately before the marker
              start = src.rfind('\\n#', 0, marker) + 1
              nxt = re.search(r'^#[-]{8,}$', src[marker:], flags=re.M)
              if not nxt:
                  return start, len(src)
              return start, marker + nxt.start()

          s1, e1 = section_span(text, '10032-10063')
          replacement = '''# ---------------------------------------
