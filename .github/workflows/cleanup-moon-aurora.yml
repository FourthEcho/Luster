name: Clean up moon phase lighting

on:
  push:
    branches: [moon-aurora-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Remove leftover Night Lighting tuning
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re

          settings = Path('shaders/settings.glsl')
          s = settings.read_text()
          s = re.sub(r'^\s*//?\s*#define\s+MOON_PHASE_NIGHT_LIGHTING_(?:CONTRAST|SATURATION).*(?:\n|$)', '', s, flags=re.M)
          settings.write_text(s)

          props = Path('shaders/shaders.properties')
          p = props.read_text()
          p = re.sub(r'\s*MOON_PHASE_NIGHT_LIGHTING_(?:INTENSITY|CONTRAST|SATURATION)(?=\s|$)', '', p)
          props.write_text(p)

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --exclude='cleanup-moon-aurora.yml' 'MOON_PHASE_NIGHT_LIGHTING' shaders
          grep -Eq '^screen\.moon_phase_influence[[:space:]]*=[[:space:]]*MOON_PHASE_AFFECTS_BRIGHTNESS MOON_PHASE_BRIGHTNESS_INTENSITY <empty> MOON_PHASE_NIGHT_ATMOSPHERE MOON_PHASE_NIGHT_ATMOSPHERE_INTENSITY <empty> MOON_PHASE_REFLECTIONS MOON_PHASE_REFLECTIONS_INTENSITY[[:space:]]*$' shaders/shaders.properties
          grep -Eq '^screen\.aurora.*AURORA_GROUND_LIGHTING' shaders/shaders.properties
          grep -q 'ambient_color += AURORA_GROUND_LIGHTING \* aurora_lighting;' shaders/program/d0_sky_map.vsh

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-moon-aurora.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove leftover Moon Phase Night Lighting settings [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
