name: Remove Git LFS and restore texture assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore assets and remove LFS
        shell: bash
        run: |
          set -euo pipefail
          OLD_COMMIT="f9f713603c90c5132f9b9539ba98bceedfd13588"

          for path in \
            shaders/image/atmosphere/scattering.dat \
            shaders/image/curl_3d.dat \
            shaders/image/galaxy.png \
            shaders/image/noise.png \
            shaders/image/perlin_3d.dat \
            shaders/image/spatial_reuse0.bin \
            shaders/image/spatial_reuse1.bin \
            shaders/image/spatial_reuse2.bin \
            shaders/image/spatial_reuse3.bin \
            shaders/image/worley_bubbly.dat \
            shaders/image/worley_swirley.dat; do
            git show "${OLD_COMMIT}:${path}" > "${path}"
          done

          curl -L --fail --retry 4 -o /tmp/alpha.zip \
            https://github.com/Luna5ama/Alpha-Piscium/releases/download/v1.9.2/Alpha-Piscium_v1.9.2.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          z = ZipFile('/tmp/alpha.zip')
          wanted = {
              'cumulus_detail1.bin': 'shaders/image/cumulus_detail1.bin',
              'cumulus_detail2.bin': 'shaders/image/cumulus_detail2.bin',
              'cumulus_curl.bin': 'shaders/image/cumulus_curl.bin',
          }
          for member in z.namelist():
              name = Path(member).name
              if name in wanted and '/shaders/textures/' in member:
                  Path(wanted[name]).write_bytes(z.read(member))
          for name, out in wanted.items():
              p = Path(out)
              if not p.exists():
                  raise SystemExit(f'missing {name} in Alpha Piscium archive')
          PY

          rm -f docs/images/scenery.png .gitattributes
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('<img src="docs/images/scenery.png" alt="Luster shader pack screenshot" width="800">\n\n', '')
          p.write_text(s)
          PY

          if grep -RIl --include='*.png' --include='*.dat' --include='*.bin' '^version https://git-lfs.github.com/spec/v1$' shaders/image; then
            echo 'LFS pointer remains'
            exit 1
          fi

          test "$(stat -c%s shaders/image/atmosphere/scattering.dat)" -eq 393216
          test "$(stat -c%s shaders/image/galaxy.png)" -eq 1926668
          test "$(stat -c%s shaders/image/noise.png)" -eq 758477
          test "$(stat -c%s shaders/image/worley_bubbly.dat)" -eq 262144
          test "$(stat -c%s shaders/image/worley_swirley.dat)" -eq 262144
          test "$(stat -c%s shaders/image/cumulus_detail1.bin)" -eq 2097152
          test "$(stat -c%s shaders/image/cumulus_detail2.bin)" -eq 2097152
          test "$(stat -c%s shaders/image/cumulus_curl.bin)" -eq 1048576

      - name: Commit repaired repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/remove-lfs-assets.yml .github/workflows/repair-lfs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove Git LFS and restore texture assets [skip ci]'
          git push origin HEAD:main
