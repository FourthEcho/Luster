name: Repair LFS texture pointers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore real texture blobs
        shell: bash
        run: |
          set -euo pipefail

          # Restore the original non-LFS Luster assets from the last known-good commit.
          git checkout f9f713603c90c5132f9b9539ba98bceedfd13588 -- \
            shaders/image/atmosphere/scattering.dat \
            shaders/image/curl_3d.dat \
            shaders/image/galaxy.png \
            shaders/image/noise.png \
            shaders/image/perlin_3d.dat \
            shaders/image/spatial_reuse0.bin \
            shaders/image/spatial_reuse1.bin \
            shaders/image/spatial_reuse2.bin \
            shaders/image/spatial_reuse3.bin \
            shaders/image/worley_bubbly.dat \
            shaders/image/worley_swirley.dat

          # These newer cloud assets are identical to the verified Alpha Piscium v1.9.2 binaries.
          curl -L --fail --retry 4 -o /tmp/alpha.zip \
            https://github.com/Luna5ama/Alpha-Piscium/releases/download/v1.9.2/Alpha-Piscium_v1.9.2.zip
          unzip -j /tmp/alpha.zip \
            '*/shaders/textures/cumulus_detail1.bin' \
            '*/shaders/textures/cumulus_detail2.bin' \
            '*/shaders/textures/cumulus_curl.bin' \
            -d /tmp/alpha-textures

          cp /tmp/alpha-textures/cumulus_detail1.bin shaders/image/cumulus_detail1.bin
          cp /tmp/alpha-textures/cumulus_detail2.bin shaders/image/cumulus_detail2.bin
          cp /tmp/alpha-textures/cumulus_curl.bin shaders/image/cumulus_curl.bin

          # scenery.png is an unreachable LFS pointer and is only a README decoration.
          rm -f docs/images/scenery.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('\n<img src="docs/images/scenery.png" alt="Luster shader pack screenshot" width="800">\n', '\n')
          p.write_text(s)
          PY

          # Remove the LFS rules so future GitHub ZIP downloads contain ordinary Git blobs.
          rm -f .gitattributes

          # Fail if any tracked shader texture is still an LFS pointer.
          if grep -RIl --include='*.png' --include='*.dat' --include='*.bin' '^version https://git-lfs.github.com/spec/v1$' shaders/image; then
            echo 'ERROR: LFS pointer(s) remain under shaders/image.'
            exit 1
          fi

          echo 'Repaired texture sizes:'
          find shaders/image -type f \( -name '*.png' -o -name '*.dat' -o -name '*.bin' \) -printf '%s %p\n' | sort

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-lfs.yml
          git add -A
          git commit -m 'Fix texture downloads and remove Git LFS [skip ci]'
          git push origin HEAD:main
