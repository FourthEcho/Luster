name: Repair LFS texture pointers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Restore real texture blobs
        shell: bash
        run: |
          set -euo pipefail

          OLD_COMMIT="f9f713603c90c5132f9b9539ba98bceedfd13588"

          # Use git show instead of checkout so Git LFS filters cannot interfere.
          for path in \
            shaders/image/atmosphere/scattering.dat \
            shaders/image/curl_3d.dat \
            shaders/image/galaxy.png \
            shaders/image/noise.png \
            shaders/image/perlin_3d.dat \
            shaders/image/spatial_reuse0.bin \
            shaders/image/spatial_reuse1.bin \
            shaders/image/spatial_reuse2.bin \
            shaders/image/spatial_reuse3.bin \
            shaders/image/worley_bubbly.dat \
            shaders/image/worley_swirley.dat; do
            git show "${OLD_COMMIT}:${path}" > "${path}"
          done

          # These newer cloud assets match the verified Alpha Piscium v1.9.2 binaries exactly.
          curl -L --fail --retry 4 -o /tmp/alpha.zip \
            https://github.com/Luna5ama/Alpha-Piscium/releases/download/v1.9.2/Alpha-Piscium_v1.9.2.zip
          rm -rf /tmp/alpha
          mkdir -p /tmp/alpha
          unzip -q /tmp/alpha.zip -d /tmp/alpha

          cp "/tmp/alpha/Alpha Piscium v1.9.2/shaders/textures/cumulus_detail1.bin" shaders/image/cumulus_detail1.bin
          cp "/tmp/alpha/Alpha Piscium v1.9.2/shaders/textures/cumulus_detail2.bin" shaders/image/cumulus_detail2.bin
          cp "/tmp/alpha/Alpha Piscium v1.9.2/shaders/textures/cumulus_curl.bin" shaders/image/cumulus_curl.bin

          # scenery.png is an unreachable LFS pointer and is only a README decoration.
          rm -f docs/images/scenery.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('\n<img src="docs/images/scenery.png" alt="Luster shader pack screenshot" width="800">\n', '\n')
          p.write_text(s)
          PY

          # Remove LFS completely so future GitHub ZIP downloads contain ordinary Git blobs.
          rm -f .gitattributes

          # Verify the expected real sizes and fail on any remaining LFS pointers.
          test "$(stat -c%s shaders/image/atmosphere/scattering.dat)" -eq 393216
          test "$(stat -c%s shaders/image/curl_3d.dat)" -eq 786432
          test "$(stat -c%s shaders/image/galaxy.png)" -eq 1926668
          test "$(stat -c%s shaders/image/noise.png)" -eq 758477
          test "$(stat -c%s shaders/image/perlin_3d.dat)" -eq 786432
          test "$(stat -c%s shaders/image/spatial_reuse0.bin)" -eq 131072
          test "$(stat -c%s shaders/image/spatial_reuse1.bin)" -eq 131072
          test "$(stat -c%s shaders/image/spatial_reuse2.bin)" -eq 131072
          test "$(stat -c%s shaders/image/spatial_reuse3.bin)" -eq 131072
          test "$(stat -c%s shaders/image/worley_bubbly.dat)" -eq 262144
          test "$(stat -c%s shaders/image/worley_swirley.dat)" -eq 262144
          test "$(stat -c%s shaders/image/cumulus_detail1.bin)" -eq 2097152
          test "$(stat -c%s shaders/image/cumulus_detail2.bin)" -eq 2097152
          test "$(stat -c%s shaders/image/cumulus_curl.bin)" -eq 1048576
          ! grep -RIl --include='*.png' --include='*.dat' --include='*.bin' '^version https://git-lfs.github.com/spec/v1$' shaders/image

      - name: Commit repair and remove workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-lfs.yml .github/workflows/remove-lfs-assets.yml
          git add -A
          git commit -m 'Remove Git LFS and restore texture assets [skip ci]'
          git push origin HEAD:main
